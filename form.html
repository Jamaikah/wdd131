<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Review Form</title>
    <meta name="description" content="This site is for the week's 5 assignment. In this task we are tasked to create a product review form.">
    <meta name="author" content="Haezell Jamaikah Abdul">
    <link rel="stylesheet" href="styles/form.css">
    <link rel="stylesheet" href="styles/form-large.css">
    <script src="scripts/form.js" defer></script>
</head>
<body>
    <header>
        <h1>Product Review</h1>
    </header>

    <main>
        <form method="get" action="review.html" class="prod-rev">
            <fieldset>
                <label for="product" class="title">Product Name
                    <select name="product" id="product" required>
                       <option value="" disabled selected>Select a Product...</option>
                    <option value="fc-1888">Flux Capacitor</option>
                    <option value="fc-2050">Power Laces</option>
                    <option value="fs-1987">Time Circuits</option>
                    <option value="ac-2000">Low Voltage Reactor</option>
                    <option value="jj-1969">Warp Equalizer</option>
                    </select>
                </label>

                <label class="title">Overall Rating</label>
                <label><input type="radio" name="stars" id="star1" value="1" required>★</label>
                <label><input type="radio" name="stars" id="star2" value="2" required>★★</label>
                <label><input type="radio" name="stars" id="star3" value="3" required>★★★</label>
                <label><input type="radio" name="stars" id="star4" value="4" required>★★★★</label>
                <label><input type="radio" name="stars" id="star5" value="5" required>★★★★★</label>

            
                <label class="title">Date of Installation</label>
                <label><input type="date" name="completeDate" id="completeDate" required></label>
                

                <label class="title">Which feature did you find useful in the product?</label>
                <div class="italic">(Check all that apply)</div>
                <label><input type="checkbox" name="durability" id="durability" value="yes"> Durability</label>
                <label><input type="checkbox" name="ease" id="ease" value="yes"> Ease of Use</label>
                <label><input type="checkbox" name="performance" id="performance" value="yes"> Performance</label>
                <label><input type="checkbox" name="design" id="design" value="yes"> Design</label>

                <label for="review" class="title">Written Review (Optional)</label>
                <textarea name="review" id="review"></textarea>

                <label class="title">Your Name (Optional)</label>
                <label><input type="text" name="name" id="name"></label>

                <input type="submit" value="Post Review">
            </fieldset>
        </form>
    </main>
    
    <footer>
        <p>
            <span id="currentyear"></span>
            © 2026 | Haezell Jamaikah Abdul | Philippines
        </p>
    
        <p id="lastModified"></p>
    </footer>
</body>
</html>
